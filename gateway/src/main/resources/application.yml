server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: USER-SERVICE
          uri: lb://USER-SERVICE
          predicates:
            - Path:/users/**
        - id: PRODUCT-SERVICE
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path:/products/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka